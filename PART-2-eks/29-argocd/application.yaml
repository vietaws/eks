apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vietaws-argo-application
  namespace: argocd
  # https://github.com/argoproj/argo-cd/tree/master/manifests
spec:
  project: default
  source:
    repoURL: https://github.com/vietaws/argocd-demo.git
    targetRevision: HEAD
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
