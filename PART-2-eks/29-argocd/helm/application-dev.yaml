# Same Application name as ../application.yaml, so `kubectl apply` updates it in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vietaws-argo-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vietaws/argocd-demo.git
    targetRevision: HEAD
    path: charts/myapp
    helm:
      # Keep resource names (myapp, myapp-service) identical to the plain manifests.
      # Without this, Argo CD uses the Application name as the release name.
      releaseName: myapp
      valueFiles:
        - ../../envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
