apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vietaws/argocd-demo.git
    targetRevision: HEAD
    path: charts/myapp          # same chart as myapp
    helm:
      releaseName: orders
      valueFiles:
        - ../../envs/dev/orders.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: orders

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
