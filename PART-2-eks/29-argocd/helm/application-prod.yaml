# Same Application name as ../application-prod.yaml, so `kubectl apply` updates it in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vietaws-argo-application-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vietaws/argocd-demo.git
    targetRevision: HEAD
    path: charts/myapp
    helm:
      releaseName: myapp
      valueFiles:
        - ../../envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: myapp-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
