# Apply once per cluster: kubectl apply -f alb/ingress-class.yaml
# Requires the AWS Load Balancer Controller (see 07-alb-path-routing).
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: aws-ingress-class
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress.k8s.aws/alb
