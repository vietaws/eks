# Defaults. Each environment overrides what it needs in envs/<env>/values.yaml
replicas: 2

image:
  repository: vietaws/eks
  tag: v1

containerPort: 8080

service:
  port: 8080

# Settings read by the vietaws/eks image. Empty = variable not set (image default applies).
appEnv: ""            # APP_ENV, for example dev or prod
backgroundColor: ""   # BACKGROUND_COLOR, for example "#283E5B"
logLevel: ""          # LOG_LEVEL: error, warn, info, debug
appVersion: ""        # APP_VERSION; "auto" = image.tag without the leading "v"

# HTTP readiness and liveness probes (the vietaws/eks image serves /healthz)
probes:
  enabled: false
  path: /healthz

# Extra environment variables for the container, for example:
# env:
#   - name: FOO
#     value: bar
env: []

# AWS Load Balancer Controller Ingress. One ALB per release: set a unique loadBalancerName per environment.
ingress:
  enabled: false
  className: aws-ingress-class   # see alb/ingress-class.yaml
  loadBalancerName: ""           # max 32 characters, unique per environment
  scheme: internet-facing
  healthcheckPath: /healthz
