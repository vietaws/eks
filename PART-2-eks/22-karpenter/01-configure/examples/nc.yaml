# Render with: envsubst < nc.yaml | kubectl apply -f -   (needs CLUSTER_NAME)
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: team-a
spec:
  role: KarpenterNodeRole-${CLUSTER_NAME}
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: team-a
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
