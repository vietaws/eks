apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"] # allow Graviton for cost savings
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"] # Spot first, fall back to on-demand
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"] # allow only 4th generation and newer instances
        - key: karpenter.k8s.aws/instance-cpu
          operator: Lt
          values: ["17"]
        - key: karpenter.k8s.aws/instance-memory
          operator: Lt
          values: ["32769"] # 32 GiB
        - key: karpenter.k8s.aws/instance-memory
          operator: Gt
          values: ["4095"] # at least 4 GiB: nano/micro/small nodes are too small to boot and join (allocatable memory about 15Mi)
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 336h # 14 days (Karpenter default is 720h = 30 days)
  limits:
    cpu: 100 # hard cap on the total vCPU this NodePool may launch (protects a demo account)
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized # Karpenter shrinking the cluster to cut costs when nodes are underutilized or empty (no pods).  Other options: Never, WhenEmpty

  # Note: Karpenter will not consolidate nodes that are running pods with the following characteristics:
  #   - Pods with local storage (emptyDir, hostPath, etc.)
  #   - Pods with a PodDisruptionBudget (PDB) that would be violated by evicting the pod
  #   - Pods that are not managed by a controller (e.g. Deployment, StatefulSet, etc.)
  #   - Pods that have been recently created or updated (default: 5 minutes)

  #  Karpenter launches the replacement node first for "replace" consolidation, but it does not pin the old pods onto it. The order for a node being replaced is:
  
  # 1. Decide: Karpenter simulates whether the node's pods fit on free capacity elsewhere (delete) or need a cheaper node (replace).
  # 2. Launch the replacement (replace only): It creates the new node and waits until it is registered and ready. For a plain delete, no new node is created.
  # 3. Taint the old node: It adds karpenter.sh/disrupted:NoSchedule, so no new pods land on the old node.
  # 4. Evict the pods: Eviction respects PodDisruptionBudgets (PDBs). A PDB can pause it until enough other replicas are ready.
  # 5. Reschedule the pods: The pod's controller (Deployment or ReplicaSet) creates new pods, and the Kubernetes scheduler places them. They usually land on the new node or on other free capacity, but Karpenter does not choose.
  # 6. Terminate the old instance: This happens once it is drained.


#  # Note: Karpenter does not know whether a pod is in the middle of a transaction. It only sees readiness probes and PodDisruptionBudgets (PDBs). Your app must handle a shutdown gracefully.
  
# What happens to a pod being evicted
# 1. Karpenter evicts the pod, and the PDB decides if the eviction is allowed now.
# 2. The pod is marked for deletion and removed from the Service endpoints. This update reaches kube-proxy and load balancers a moment later, so a few new requests can still arrive.
# 3. The preStop hook runs, then the container gets SIGTERM.
# 4. The app has terminationGracePeriodSeconds (default 30 s) to finish work and exit. After that it gets SIGKILL, and anything unfinished is lost.

# The replacement pod is created by the Deployment as soon as the old pod starts terminating. It does not wait for the old one to finish. That is why you need 2 or more replicas: the others serve traffic while the replacement starts.

    consolidateAfter: 1m # node must stay unchanged for one minute before Karpenter treats it as a candidate for consolidation. Prod env: 5m or 30m is more reasonable. Cost-first: 0s to 30s, with a PDB and a graceful shutdown on every service.
    budgets:
      - nodes: "10%" #  how many nodes can be disrupted at once.
