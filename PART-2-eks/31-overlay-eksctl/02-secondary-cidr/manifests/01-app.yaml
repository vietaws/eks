apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: app
spec:
  replicas: 3 # scaled up in the README
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: simple-app
          image: vietaws/eks:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  labels:
    app: app
spec:
  type: ClusterIP # target-type ip: the ALB talks straight to pod IPs (secondary CIDR is VPC-routable)
  selector:
    app: app
  ports:
    - port: 8080
      targetPort: 8080
