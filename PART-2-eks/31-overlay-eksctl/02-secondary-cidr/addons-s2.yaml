# TEMPLATE: values come from config.env. Use the rendered copy: .rendered/addons-s2.yaml
#
# Stage 2: custom networking + prefix delegation.
# Applied BEFORE the stage-2 node group is created (scripts/stage.sh 2).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ${CLUSTER_NAME}
  region: ${REGION}

addons:
  - name: vpc-cni
    resolveConflicts: overwrite
    configurationValues: |-
      {"env": {
        "AWS_VPC_K8S_CNI_CUSTOM_NETWORK_CFG": "true",
        "ENI_CONFIG_LABEL_DEF": "topology.kubernetes.io/zone",
        "ENABLE_PREFIX_DELEGATION": "true",
        "WARM_PREFIX_TARGET": "${WARM_PREFIX_TARGET}"
      }}
