# Karpenter cluster (upg-karp). Rendered by scripts/up-all.sh with envsubst: CLUSTER_NAME, AMI_ALIAS, NODE_TYPE.
# The AMI alias is PINNED (production pattern): nodes change only when you change the alias.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: "KarpenterNodeRole-${CLUSTER_NAME}"
  amiSelectorTerms:
    - alias: "${AMI_ALIAS}"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
    - tags: # EKS cluster SG: the LB controller needs it on node ENIs to open IP-target NLB/ALB traffic
        kubernetes.io/cluster/${CLUSTER_NAME}: owned
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: upgrade-demo
spec:
  template:
    spec:
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${NODE_TYPE}"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"] # no Spot interruptions to confuse the downtime numbers
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h
      terminationGracePeriod: 1h # a stuck drain cannot block an upgrade forever
  limits:
    cpu: 20
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "1" # replace one node at a time during drift
