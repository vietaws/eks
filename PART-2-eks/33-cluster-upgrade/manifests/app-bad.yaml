# The same app written carelessly, to show where real downtime comes from: one replica, no readiness probe,
# no preStop delay, no PDB. Rendered by scripts/deploy-app.sh bad.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      nodeSelector:
        "${SEL_KEY}": "${SEL_VAL}"
      containers:
        - name: web
          image: vietaws/eks:home
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: deregistration_delay.timeout_seconds=20
spec:
  type: LoadBalancer
  loadBalancerClass: "${LB_CLASS}"
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
