# Auto Mode cluster (upg-auto). Rendered with envsubst: NODE_TYPE.
# A custom pool pins the instance type so all three clusters use the same node size. If Auto Mode does not offer
# that type, the pool launches nothing: see the fallback in README.md.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: upgrade-demo
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["${NODE_TYPE}"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: 336h # Auto Mode never lets a node live longer than 21 days
      terminationGracePeriod: 1h
  limits:
    cpu: "20"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
