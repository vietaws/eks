apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpa-vietaws
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: vpa-demo-deployment
  updatePolicy:
    updateMode: "Recreate" # default: evicts the pod and recreates it with the new requests
    # updateMode: "InPlaceOrRecreate" # resize the running pod in place (K8s 1.33+, VPA 1.4+); falls back to Recreate if in-place fails
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 5m
          memory: 5Mi
        maxAllowed:
          cpu: 1
          memory: 500Mi
        # controlledResources: ["cpu", "memory"]
