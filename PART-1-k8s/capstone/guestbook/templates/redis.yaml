apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels: { app: {{ .Release.Name }}-redis, tier: data }
spec:
  clusterIP: None          # headless: stable per-Pod DNS for the StatefulSet
  selector: { app: {{ .Release.Name }}-redis }
  ports: [{ port: 6379, name: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: 1
  selector:
    matchLabels: { app: {{ .Release.Name }}-redis }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-redis, tier: data }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: REDIS_PASSWORD
          ports: [{ containerPort: 6379, name: redis }]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 32Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
