# kind cluster for the Kubernetes course.
# 1 control-plane + 2 workers so we can demonstrate scheduling,
# taints, node affinity, DaemonSets, and cordon/drain with real nodes.
#
# Create:   kind create cluster --name k8s-course --config cluster/kind-config.yaml
# Delete:   kind delete cluster --name k8s-course
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-course
nodes:
  - role: control-plane
    # Port mappings let ingress-nginx (Section 12) be reachable on localhost.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    # A custom label we use in the labels/affinity lessons.
    labels:
      viet.vn/node-pool: "general"
  - role: worker
    labels:
      viet.vn/node-pool: "general"
