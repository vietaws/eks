apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer
spec:
  restartPolicy: Never
  volumes:
    - name: secret-vol
      secret:
        secretName: app-secret
  containers:
    - name: app
      image: busybox:1.36
      # Prints env (demo only — never log real secrets!) and lists the mounted files.
      command: ["/bin/sh", "-c", "echo user=$DB_USER; ls /etc/secret; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
      volumeMounts:
        - name: secret-vol
          mountPath: /etc/secret
          readOnly: true
