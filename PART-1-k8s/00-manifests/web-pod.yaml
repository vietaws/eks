apiVersion: v1
kind: Pod
metadata:
  name: web-demo
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
