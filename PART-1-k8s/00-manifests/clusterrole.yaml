# A ClusterRole (cluster-wide, not namespaced) that can read nodes,
# bound cluster-wide to a ServiceAccount via a ClusterRoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-viewer-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-viewer-binding
subjects:
  - kind: ServiceAccount
    name: node-viewer-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: node-viewer
  apiGroup: rbac.authorization.k8s.io
