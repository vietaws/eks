# A Deployment configured entirely from a ConfigMap + Secret.
# - envFrom pulls ALL keys of the ConfigMap as env vars
# - DB_PASSWORD comes from the Secret
# - app.properties is mounted as a file
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configured-app
  labels:
    app: configured-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configured-app
  template:
    metadata:
      labels:
        app: configured-app
    spec:
      volumes:
        - name: config-vol
          configMap:
            name: app-config
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo booting with COLOR=$APP_COLOR MODE=$APP_MODE DB_USER=$DB_USER; cat /etc/appconfig/app.properties; sleep 3600"]
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: config-vol
              mountPath: /etc/appconfig
