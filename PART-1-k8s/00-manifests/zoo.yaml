# A small zoo of Pods with varied labels, for practicing selectors.
apiVersion: v1
kind: Pod
metadata:
  name: web-prod-stable
  labels: { app: shop, tier: frontend, env: prod, track: stable }
spec:
  containers: [{ name: c, image: nginx:1.27-alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: web-prod-canary
  labels: { app: shop, tier: frontend, env: prod, track: canary }
spec:
  containers: [{ name: c, image: nginx:1.27-alpine }]
---
apiVersion: v1
kind: Pod
metadata:
  name: api-prod-stable
  labels: { app: shop, tier: backend, env: prod, track: stable }
spec:
  containers: [{ name: c, image: hashicorp/http-echo:1.0, args: ["-text=api","-listen=:5678"] }]
---
apiVersion: v1
kind: Pod
metadata:
  name: web-dev-stable
  labels: { app: shop, tier: frontend, env: dev, track: stable }
spec:
  containers: [{ name: c, image: nginx:1.27-alpine }]
