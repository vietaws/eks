# Exposes the echo Deployment on a static port on every node.
apiVersion: v1
kind: Service
metadata:
  name: vietvn-nodeport
  labels:
    app: vietvn
spec:
  type: NodePort
  selector:
    app: vietvn
  ports:
    - name: http
      port: 80
      targetPort: 5678
      nodePort: 30080   # must be in the 30000-32767 range
