apiVersion: v1
kind: Pod
metadata:
  name: web-with-sidecar
  labels:
    app: web-sidecar
spec:
  # Both containers share this volume and the same network namespace.
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    # Main app: writes a heartbeat line into the shared volume every 2s.
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          i=0;
          while true; do
            i=$((i+1));
            echo "$(date -u +%T) app heartbeat #$i" | tee -a /var/log/app/app.log;
            sleep 2;
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
    # Sidecar: tails the same file the app writes (log shipper pattern).
    - name: log-sidecar
      image: busybox:1.36
      command: ["/bin/sh", "-c", "touch /var/log/app/app.log; tail -F /var/log/app/app.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log/app
