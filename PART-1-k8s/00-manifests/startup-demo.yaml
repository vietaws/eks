# Startup probe: gives a slow-starting app time before liveness kicks in.
# Here the app is "starting" (no /tmp/started) for ~10s; startupProbe waits,
# and only after it passes does the livenessProbe begin checking.
apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      args:
        - /bin/sh
        - -c
        - sleep 10; touch /tmp/started; sleep 600
      startupProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 2
        failureThreshold: 15     # up to 30s to start
      livenessProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 5
