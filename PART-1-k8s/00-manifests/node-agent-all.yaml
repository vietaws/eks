# A DaemonSet that tolerates ALL taints, so it even runs on the control-plane
# node (which carries a NoSchedule taint). This is how real logging/monitoring
# agents ensure coverage of every node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent-all
  labels:
    app: node-agent-all
spec:
  selector:
    matchLabels:
      app: node-agent-all
  template:
    metadata:
      labels:
        app: node-agent-all
    spec:
      tolerations:
        # Tolerate everything (covers control-plane taints too).
        - operator: "Exists"
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo agent on $(NODE_NAME); sleep 3600"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
