apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-demo
  labels:
    app: lifecycle
spec:
  restartPolicy: Always
  # Init containers run to completion, in order, before app containers start.
  initContainers:
    - name: init-wait
      image: busybox:1.36
      command: ["/bin/sh", "-c", "echo 'init: preparing...'; sleep 3; echo 'init: done'"]
  containers:
    - name: main
      image: busybox:1.36
      # Runs for 10s then exits 0; with restartPolicy Always it restarts.
      command: ["/bin/sh", "-c", "echo 'main started'; sleep 10; echo 'main exiting'"]
